AWSTemplateFormatVersion: "2010-09-09"
Description: Detour deployment bootstrap - ECR and a GitHub Actions OIDC deployment role

Parameters:
  GitHubSubjectClaim:
    Type: String
    Description: Exact GitHub OIDC sub claim allowed to deploy (for example repo:owner/repository:ref:refs/heads/main)
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: ARN of an existing token.actions.githubusercontent.com provider; leave empty to create one
  RepositoryName:
    Type: String
    Default: detour
    AllowedPattern: "[a-z0-9]+(?:[._/-][a-z0-9]+)*"
  ApplicationStackName:
    Type: String
    Default: detour-production
  NotificationEmail:
    Type: String
    Default: ""
    Description: Optional address for account-wide monthly budget notifications
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    MinValue: 1
    Description: Account-wide monthly cost budget in US dollars

Conditions:
  CreateGitHubProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  HasNotificationEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: Detour

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the newest 10 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 10
              },
              "action": {"type": "expire"}
            }]
          }
      Tags:
        - Key: Project
          Value: Detour

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: detour-account-monthly-cost
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers: !If
        - HasNotificationEmail
        - - Notification:
              ComparisonOperator: GREATER_THAN
              NotificationType: FORECASTED
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - Address: !Ref NotificationEmail
                SubscriptionType: EMAIL
          - Notification:
              ComparisonOperator: GREATER_THAN
              NotificationType: ACTUAL
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - Address: !Ref NotificationEmail
                SubscriptionType: EMAIL
        - !Ref AWS::NoValue

  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Creates and updates the Detour application stack
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ManageDetourInfrastructure
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:*
                  - elasticloadbalancing:*
                  - ecs:*
                  - rds:*
                  - secretsmanager:*
                  - logs:*
                  - application-autoscaling:*
                  - sns:*
                  - budgets:*
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  - cloudwatch:DescribeAlarms
                  - route53:ChangeResourceRecordSets
                  - route53:GetChange
                  - route53:ListResourceRecordSets
                Resource: "*"
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:CreateServiceLinkedRole
                Resource: "*"
      Tags:
        - Key: Project
          Value: Detour

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Short-lived GitHub Actions role for Detour deployments
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjectClaim
      Policies:
        - PolicyName: PublishAndDeployDetour
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PublishImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                  - ecr:DescribeImages
                Resource: !GetAtt ImageRepository.Arn
              - Sid: DeployStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:UpdateStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ApplicationStackName}/*
              - Sid: PassCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
      Tags:
        - Key: Project
          Value: Detour

Outputs:
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn
  CloudFormationRoleArn:
    Description: Set this as the GitHub repository variable AWS_CLOUDFORMATION_ROLE_ARN
    Value: !GetAtt CloudFormationExecutionRole.Arn
  EcrRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  EcrRepositoryName:
    Description: Set this as the GitHub repository variable AWS_ECR_REPOSITORY
    Value: !Ref ImageRepository
  BudgetName:
    Description: Account-wide budget retained even when the application stack is off
    Value: !Ref MonthlyCostBudget

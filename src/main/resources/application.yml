spring:
  application:
    name: detour
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/detour;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /docs


name: deploy-preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "infra/aws/preview.yml"
      - ".github/workflows/deploy-preview.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: detour-preview
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY || 'detour' }}
  STACK_NAME: ${{ vars.AWS_PREVIEW_STACK_NAME || 'detour-preview' }}

jobs:
  deploy:
    if: ${{ vars.AWS_PREVIEW_DEPLOY_ENABLED == 'true' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_CLOUDFORMATION_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: detour-github-preview

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - id: image
        name: Resolve immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Reusing existing immutable image $IMAGE_URI"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and publish preview image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy preview stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws/preview.yml \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides ContainerImage="${{ steps.image.outputs.uri }}"

      - name: Show preview URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].[OutputValue]" \
            --output text

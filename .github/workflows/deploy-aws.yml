name: deploy-aws

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile"
      - "infra/aws/**"
      - ".github/workflows/deploy-aws.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: detour-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ECR_REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY || 'detour' }}
  STACK_NAME: ${{ vars.AWS_STACK_NAME || 'detour-production' }}

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_CLOUDFORMATION_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: detour-github-deploy

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - id: image
        name: Resolve immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Reusing existing immutable image $IMAGE_URI"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Build and publish ARM image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy application stack
        run: |
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file infra/aws/app.yml \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ContainerImage="${{ steps.image.outputs.uri }}" \
              EnvironmentName=production \
              DesiredCount="${{ vars.AWS_DESIRED_COUNT || '1' }}" \
              MaximumCount="${{ vars.AWS_MAXIMUM_COUNT || '2' }}" \
              DatabaseInstanceClass="${{ vars.AWS_DATABASE_INSTANCE_CLASS || 'db.t4g.micro' }}" \
              DatabaseMultiAz="${{ vars.AWS_DATABASE_MULTI_AZ || 'false' }}" \
              AllowedIngressCidr="${{ vars.AWS_ALLOWED_INGRESS_CIDR || '0.0.0.0/0' }}" \
              CertificateArn="${{ vars.AWS_CERTIFICATE_ARN }}" \
              DomainName="${{ vars.AWS_DOMAIN_NAME }}" \
              HostedZoneId="${{ vars.AWS_HOSTED_ZONE_ID }}" \
              NotificationEmail="${{ vars.AWS_NOTIFICATION_EMAIL }}"

      - name: Show deployment URL
        run: |
          aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DomainUrl' || OutputKey=='WebsiteUrl'].[OutputKey,OutputValue]" \
            --output table

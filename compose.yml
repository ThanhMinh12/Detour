services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: detour
      POSTGRES_USER: detour
      POSTGRES_PASSWORD: detour-local
    volumes:
      - detour-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detour"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/detour
      DATABASE_USERNAME: detour
      DATABASE_PASSWORD: detour-local
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  detour-postgres:

